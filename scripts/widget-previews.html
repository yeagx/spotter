<!doctype html>
<!--
  Mock-ups of each home screen widget, for the Android widget picker's preview images.
  Not app code: scripts/make-widget-previews.py opens this in headless Chrome once per
  widget (#Today:320:160, ...) and screenshots it. Colours, type and the slant follow
  src/theme.ts and src/lib/slant.ts, and the layout follows src/widgets/*.tsx.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Michroma; src: url('../node_modules/@expo-google-fonts/michroma/400Regular/Michroma_400Regular.ttf'); }
  @font-face { font-family: Manrope; font-weight: 500; src: url('../node_modules/@expo-google-fonts/manrope/500Medium/Manrope_500Medium.ttf'); }
  @font-face { font-family: Manrope; font-weight: 700; src: url('../node_modules/@expo-google-fonts/manrope/700Bold/Manrope_700Bold.ttf'); }
  @font-face { font-family: Manrope; font-weight: 800; src: url('../node_modules/@expo-google-fonts/manrope/800ExtraBold/Manrope_800ExtraBold.ttf'); }
  :root {
    --surface: #161616; --raised: #222222; --ink: #ffffff; --muted: #9a9a9a;
    --red: #e70b16; --red-text: #ff4450;
  }
  html, body { margin: 0; background: transparent; }
  .card {
    box-sizing: border-box; width: var(--w); height: var(--h); background: var(--surface);
    border-radius: 24px; padding: 16px; display: flex; flex-direction: column;
    color: var(--ink); font-family: Manrope; font-weight: 500; overflow: hidden;
  }
  .label { font-family: Michroma; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .spacer { flex: 1; }
  .title { font-weight: 700; font-size: 17px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap { font-size: 13px; line-height: 18px; }
  .muted { color: var(--muted); }
  .num { font-family: Michroma; }
  .pill { background: var(--red); color: #fff; border-radius: 999px; font-weight: 700; font-size: 15px; height: 28px; padding: 0 16px; display: flex; align-items: center; }
  .center { align-items: center; justify-content: center; }
  svg { display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // src/lib/slant.ts, line for line.
  const SLANT = 0.5;
  const cutFor = (w, h) => Math.min(h * SLANT, w * 0.34);
  function strip(bars, width, height, gap) {
    const n = bars.length, w = (width - gap * (n - 1)) / n;
    const shapes = bars.map((b, i) => {
      const h = Math.max(1, height * (b.value ?? 1)), x = i * (w + gap), y = height - h, c = cutFor(w, h);
      const tl = i === 0 ? x : x + c, br = i === n - 1 ? x + w : x + w - c;
      return `<polygon points="${tl},${y} ${x + w},${y} ${br},${y + h} ${x},${y + h}" fill="${b.color}"/>`;
    }).join('');
    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${shapes}</svg>`;
  }
  function ring(d, stroke, p, inner) {
    const r = (d - stroke) / 2, c = d / 2, len = 2 * Math.PI * r;
    return `<div style="position:relative;width:${d}px;height:${d}px">
      <svg width="${d}" height="${d}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#222" stroke-width="${stroke}"/>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#e70b16" stroke-width="${stroke}" stroke-dasharray="${len * p} ${len}" transform="rotate(-90 ${c} ${c})"/></svg>
      <div style="position:absolute;inset:${stroke + 4}px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:${Math.round((d - 2 * (stroke + 4)) * 0.4)}px">${inner}</div></div>`;
  }
  const C = { done: '#e70b16', today: '#fff', planned: '#9a9a9a', rest: '#222' };
  const week = ['done', 'rest', 'done', 'planned', 'rest', 'today', 'planned'].map((k) => ({ color: C[k] }));

  const W = {
    Today: () => `<div class="card">
      <div class="row" style="gap:12px"><div class="label grow">Thursday · Day 5</div>${strip(week, 108, 14, 4)}</div>
      <div style="height:4px"></div>
      <div class="row" style="gap:12px;height:28px"><div class="title grow">Legs + Core</div><div class="pill">Start</div></div>
      <div style="margin-top:8px">
        ${[['Leg Extension', '40 kg'], ['Leg Press', '120 kg'], ['Lying Leg Curl', '35 kg']].map(([n, w]) =>
          `<div class="row cap" style="height:22px"><div class="grow">${n}</div><div class="num" style="font-size:13px">${w}</div></div>`).join('')}
      </div>
      <div class="spacer"></div>
      <div class="cap muted">+2 more · 15 sets</div></div>`,
    Month: () => `<div class="card">
      <div class="label">November · sessions</div>
      <div style="height:4px"></div>
      <div class="row" style="align-items:flex-end"><span class="num" style="font-size:32px;line-height:40px">9</span>
        <span class="num muted" style="font-size:20px;line-height:34px">/ 16</span><div class="spacer"></div>
        <div style="margin-bottom:10px">${strip(Array.from({ length: 16 }, (_, i) => ({ color: i < 9 ? '#e70b16' : '#222' })), 150, 14, 4)}</div></div>
      <div class="spacer"></div>
      ${[['Best lift', '120 kg × 10'], ['New bests', '3'], ['Body fat', '−1.2%']].map(([k, v]) =>
        `<div class="row cap" style="height:22px"><div class="muted">${k}</div><div class="spacer"></div><div>${v}</div></div>`).join('')}</div>`,
    BestLift: () => `<div class="card">
      <div class="cap muted">Leg Press</div><div style="height:4px"></div>
      <div class="row" style="align-items:baseline;gap:4px"><span class="num" style="font-size:24px">120</span><span class="cap muted">kg × 10</span></div>
      <div class="label" style="color:var(--red-text);margin-top:6px">new best</div>
      <div class="spacer"></div>
      ${strip([0.45, 0.6, 0.55, 0.75, 0.85, 1].map((v, i) => ({ value: v, color: i === 5 ? '#e70b16' : '#9a9a9a' })), 128, 52, 4)}</div>`,
    Body: () => `<div class="card">
      <div class="label">Body · Nov 5</div><div style="height:4px"></div>
      <div class="row" style="align-items:baseline;gap:4px"><span class="num" style="font-size:24px">78.4</span><span class="cap muted">kg</span></div>
      <div class="spacer"></div>
      ${[['Since last', '−0.6 kg'], ['Target', '75 kg'], ['Fat', '18.2%']].map(([k, v]) =>
        `<div class="row cap" style="height:22px"><div class="muted">${k}</div><div class="spacer"></div><div>${v}</div></div>`).join('')}</div>`,
    Start: () => `<div class="card center" style="padding:8px;gap:8px">
      <img src="../assets/logo.png" style="height:22px" />
      <div style="background:var(--red);border-radius:999px;width:100%;height:22px;display:flex;align-items:center;justify-content:center;font-family:Michroma;font-size:10px">START</div></div>`,
    Me: () => `<div class="card"><div class="row" style="gap:16px;height:100%;align-items:stretch">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">${ring(96, 4, 9 / 16, 'Y')}<span class="num" style="font-size:13px">9/16</span></div>
      <div class="grow" style="display:flex;flex-direction:column"><div class="title">Yeager</div><div class="cap muted">Get lean · Push Pull Legs</div><div class="spacer"></div>
      ${[['Best', '120 kg × 10'], ['Weight', '78.4 kg'], ['New bests', '3']].map(([k, v]) =>
        `<div class="row cap" style="height:22px"><div class="muted">${k}</div><div class="spacer"></div><div>${v}</div></div>`).join('')}</div></div></div>`,
    MeSmall: () => `<div class="card center" style="gap:4px">${ring(84, 4, 9 / 16, 'Y')}
      <div style="font-weight:700;font-size:15px;margin-top:4px">Yeager</div><div class="cap muted">9 of 16 this month</div></div>`,
  };
  const [name, w, h] = location.hash.slice(1).split(':');
  document.documentElement.style.setProperty('--w', `${w}px`);
  document.documentElement.style.setProperty('--h', `${h}px`);
  document.getElementById('root').innerHTML = W[name]();
</script>
</body>
</html>
