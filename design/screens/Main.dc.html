<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotter — Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Manrope:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;background:#0B0B0B}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
a,button,input,nav,label{flex-shrink:0;box-sizing:border-box}
.sp-fade-x{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 40px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 40px),transparent 100%)}
.sp-fade-y{-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 32px),transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 32px),transparent 100%)}
@keyframes sp-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sp-bar{from{opacity:0;transform:skewX(-26deg) scaleY(0)}to{opacity:1;transform:skewX(-26deg) scaleY(1)}}
@keyframes sp-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes sp-lock{from{opacity:0;letter-spacing:0.5em;filter:blur(4px)}to{opacity:1;letter-spacing:0.08em;filter:blur(0)}}
.sp-rise{animation:sp-rise 1000ms cubic-bezier(.16,1,.3,1) both}
.sp-bar{transform-origin:50% 100%;animation:sp-bar 900ms cubic-bezier(.16,1,.3,1) both}
.sp-press{transition:transform 260ms cubic-bezier(.16,1,.3,1),background-color 500ms ease,box-shadow 500ms ease,color 500ms ease}
.sp-press:active{transform:scale(.97)}
.sp-draw path{stroke-dasharray:24;animation:sp-draw 520ms cubic-bezier(.65,0,.35,1) both}
.sp-lock{animation:sp-lock 1400ms cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion: reduce){.sp-rise,.sp-bar,.sp-lock,.sp-draw path{animation:none}.sp-press{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0B; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex-grow: 1; padding: 56px 16px 16px; display: flex; flex-direction: column; gap: 24px; overflow: hidden;">

<div class="sp-rise" style="display: flex; align-items: center; justify-content: space-between; animation-delay: 0ms;">
<img src="/_blob/2343e23b654e0991d81019ea232da905" alt="Spotter" style="width: 27px; height: 32px; display: block;">
<a href="Profile.dc.html" class="sp-press" aria-label="Profile" style="width: 36px; height: 36px; border-radius: 50%; background: #222222; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; font-size: 15px; line-height: 20px; font-weight: 800;">Y</a>
</div>

<div class="sp-rise" style="display: flex; flex-direction: column; gap: 4px; animation-delay: 90ms;">
<div style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">SATURDAY · DAY 1</div>
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 800; letter-spacing: -0.01em;">Pull &amp; press</h1>
<div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9A9A;">6 exercises · 19 sets</div>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{ week }}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
<div class="sp-bar" style="width: 14px; height: 28px; transform: skewX(-26deg); border-radius: 2px; background: {{ d.bar }}; animation-delay: {{ d.delay }};"></div>
<div style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; color: {{ d.ink }};">{{ d.letter }}</div>
</div>
</sc-for>
</div>

<a href="Start.dc.html" class="sp-rise sp-press" style="animation-delay: 300ms; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 20px; box-sizing: border-box; background: #E70B16; color: #FFFFFF; border-radius: 16px; text-decoration: none; font-size: 17px; line-height: 24px; font-weight: 800;">
<span>Start session</span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</a>

<div class="sp-rise" style="display: flex; flex-direction: column; background: #161616; border-radius: 16px; padding: 4px 16px; animation-delay: 380ms;">
<sc-for list="{{ exercises }}" as="ex" hint-placeholder-count="6">
<a href="Exercise.dc.html" class="sp-rise" style="display: flex; align-items: center; justify-content: space-between; height: 56px; border-bottom: {{ ex.divider }}; text-decoration: none; color: #FFFFFF; animation-delay: {{ ex.delay }};">
<div style="display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 15px; line-height: 20px; font-weight: 700;">{{ ex.name }}</div>
<div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9A9A;">{{ ex.scheme }}</div>
</div>
<div style="display: flex; align-items: baseline; gap: 4px;">
<span style="font-family: Michroma, sans-serif; font-size: 17px; line-height: 22px;">{{ ex.kg }}</span>
<span style="font-size: 13px; line-height: 18px; color: #9A9A9A;">kg</span>
</div>
</a>
</sc-for>
</div>

</div>

<nav style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0px; height: 84px; box-sizing: border-box; padding: 10px 16px 24px; background: #161616; border-top: 1px solid #2A2A2A;">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #FFFFFF;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11"></path><path d="M17.5 6.5v11"></path><path d="M3.5 9v6"></path><path d="M20.5 9v6"></path><path d="M6.5 12h11"></path></svg>
<span style="font-size: 11px; line-height: 14px; font-weight: 700;">Today</span>
</a>
<a href="Plan.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #9A9A9A;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16"></path><path d="M9 3v4"></path><path d="M15 3v4"></path></svg>
<span style="font-size: 11px; line-height: 14px; font-weight: 700;">Plan</span>
</a>
<a href="Body.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #9A9A9A;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"></path><path d="M15 6h5v5"></path></svg>
<span style="font-size: 11px; line-height: 14px; font-weight: 700;">Body</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var days = [
      { letter: 'S', kind: 'today' },
      { letter: 'S', kind: 'rest' },
      { letter: 'M', kind: 'train' },
      { letter: 'T', kind: 'rest' },
      { letter: 'W', kind: 'train' },
      { letter: 'T', kind: 'rest' },
      { letter: 'F', kind: 'rest' }
    ];
    var week = days.map(function (d, i) {
      return {
        letter: d.letter,
        delay: (160 + i * 60) + 'ms',
        bar: d.kind === 'today' ? '#E70B16' : (d.kind === 'train' ? '#9A9A9A' : '#222222'),
        ink: d.kind === 'today' ? '#FFFFFF' : '#9A9A9A'
      };
    });
    var list = [
      { name: 'Lat Pulldown', scheme: '3 × 8–12', kg: '45' },
      { name: 'Flat Dumbbell Press', scheme: '3 × 8–12', kg: '20' },
      { name: 'Dumbbell Lateral Raise', scheme: '4 × 12–15', kg: '8' },
      { name: 'Dumbbell Curl', scheme: '3 × 10–12', kg: '12' },
      { name: 'Triceps Pushdown', scheme: '3 × 10–12', kg: '25' },
      { name: 'Leg Press', scheme: '3 × 10–12', kg: '100' }
    ];
    var exercises = list.map(function (e, i) {
      return Object.assign({}, e, { delay: (440 + i * 70) + 'ms', divider: i === list.length - 1 ? 'none' : '1px solid #2A2A2A' });
    });
    return { week: week, exercises: exercises };
  }
}
</script>
</body>
</html>
