<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotter — Edit day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Manrope:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;background:#0B0B0B}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
a,button,input,nav,label{flex-shrink:0;box-sizing:border-box}
.sp-fade-x{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 40px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 40px),transparent 100%)}
.sp-fade-y{-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 32px),transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 32px),transparent 100%)}
@keyframes sp-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sp-bar{from{opacity:0;transform:skewX(-26deg) scaleY(0)}to{opacity:1;transform:skewX(-26deg) scaleY(1)}}
@keyframes sp-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes sp-lock{from{opacity:0;letter-spacing:0.5em;filter:blur(4px)}to{opacity:1;letter-spacing:0.08em;filter:blur(0)}}
.sp-rise{animation:sp-rise 1000ms cubic-bezier(.16,1,.3,1) both}
.sp-bar{transform-origin:50% 100%;animation:sp-bar 900ms cubic-bezier(.16,1,.3,1) both}
.sp-press{transition:transform 260ms cubic-bezier(.16,1,.3,1),background-color 500ms ease,box-shadow 500ms ease,color 500ms ease}
.sp-press:active{transform:scale(.97)}
.sp-draw path{stroke-dasharray:24;animation:sp-draw 520ms cubic-bezier(.65,0,.35,1) both}
.sp-lock{animation:sp-lock 1400ms cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion: reduce){.sp-rise,.sp-bar,.sp-lock,.sp-draw path{animation:none}.sp-press{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0B; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 48px 16px 32px; gap: 20px;">
<div class="sp-rise" style="display: flex; align-items: center; justify-content: space-between;">
<a href="EditPlan.dc.html" class="sp-press" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #161616; text-decoration: none;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">MONDAY</div>
<div style="min-width: 44px; display: flex; justify-content: flex-end;"></div>
</div>

<div class="sp-rise" style="display: flex; flex-direction: column; gap: 8px; animation-delay: 80ms;">
<label for="sp-dayname" style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">DAY NAME</label>
<input id="sp-dayname" type="text" value="Rows &amp; incline" style="height: 56px; width: 100%; box-sizing: border-box; padding: 0 16px; border: none; border-radius: 8px; background: #222222; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; font-size: 17px; line-height: 24px; font-weight: 700; outline: none;">
</div>

<div class="sp-fade-y" style="flex-grow: 1; min-height: 0px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 24px;">
<div class="sp-rise" style="display: flex; justify-content: space-between; animation-delay: 140ms;">
<div style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">EXERCISES</div>
<div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9A9A;">tap to set sets &amp; reps</div>
</div>
<sc-for list="{{ items }}" as="e" hint-placeholder-count="6">
<div class="sp-rise" style="border-radius: 16px; background: {{ e.bg }}; box-shadow: {{ e.ring }}; animation-delay: {{ e.delay }};">
<button type="button" onClick="{{ e.pick }}" aria-expanded="{{ e.expanded }}" style="width: 100%; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; border: none; background: transparent; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; text-align: left; cursor: pointer;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14"></path><path d="M5 15h14"></path></svg>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 15px; line-height: 20px; font-weight: 700;">{{ e.name }}</span>
<span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9A9A;">{{ e.summary }}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transition: transform 500ms cubic-bezier(.16,1,.3,1); transform: {{ e.chev }};"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{ e.expanded }}" hint-placeholder-val="{{ false }}">
<div class="sp-rise" style="display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 16px;">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<div style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">SETS</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 4px;">
<button type="button" class="sp-press" onClick="{{ e.less }}" aria-label="Fewer sets" style="width: 44px; height: 44px; border: none; border-radius: 8px; background: #222222; color: #FFFFFF; font-size: 20px; line-height: 20px; cursor: pointer; padding: 0; font-family: Manrope, system-ui, sans-serif; font-weight: 700; width: 32px;">−</button>
<span style="font-family: Michroma, sans-serif; font-size: 20px; line-height: 26px;">{{ e.sets }}</span>
<button type="button" class="sp-press" onClick="{{ e.more }}" aria-label="More sets" style="width: 44px; height: 44px; border: none; border-radius: 8px; background: #222222; color: #FFFFFF; font-size: 20px; line-height: 20px; cursor: pointer; padding: 0; font-family: Manrope, system-ui, sans-serif; font-weight: 700; width: 32px;">+</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="sp-reps" style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">REPS</label>
<input id="sp-reps" type="text" value="{{ e.reps }}" style="height: 44px; width: 100%; box-sizing: border-box; border: none; border-radius: 8px; background: #222222; color: #FFFFFF; font-family: Michroma, sans-serif; font-size: 15px; line-height: 20px; text-align: center; outline: none;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="sp-rest" style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">REST</label>
<input id="sp-rest" type="text" value="1:30" style="height: 44px; width: 100%; box-sizing: border-box; border: none; border-radius: 8px; background: #222222; color: #FFFFFF; font-family: Michroma, sans-serif; font-size: 15px; line-height: 20px; text-align: center; outline: none;">
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center;">
<a href="Exercise.dc.html" style="font-size: 13px; line-height: 18px; font-weight: 700; color: #FFFFFF; text-decoration: none;">View demo</a>
<button type="button" class="sp-press" onClick="{{ e.remove }}" style="height: 36px; padding: 0 12px; border: none; border-radius: 8px; background: transparent; color: #FF4450; font-family: Manrope, system-ui, sans-serif; font-size: 13px; line-height: 18px; font-weight: 700; cursor: pointer;">Remove</button>
</div>
</div>
</sc-if>
</div>
</sc-for>
<a href="Library.dc.html" class="sp-rise sp-press" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 16px; box-shadow: inset 0 0 0 1.5px #2A2A2A; color: #FFFFFF; text-decoration: none; font-size: 15px; line-height: 20px; font-weight: 700; animation-delay: 560ms;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg> Add exercise</a>
</div>

<a href="EditPlan.dc.html" class="sp-rise sp-press" style="height: 56px; width: 100%; border: none; border-radius: 16px; background: #E70B16; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; font-size: 17px; line-height: 24px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; animation-delay: 600ms;">Save day</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      open: 0,
      list: [
        { name: 'Seated Cable Row', sets: 3, reps: '8–12' },
        { name: 'Incline Dumbbell Press', sets: 3, reps: '8–12' },
        { name: 'Rear Delt Fly', sets: 3, reps: '12–15' },
        { name: 'Dumbbell Hammer Curl', sets: 3, reps: '10–12' },
        { name: 'Overhead Dumbbell Extension', sets: 3, reps: '10–12' },
        { name: 'Seated Leg Curl', sets: 3, reps: '12–15' }
      ]
    };
  }
  setSets(i, d) {
    var list = this.state.list.map(function (e, j) { return j === i ? Object.assign({}, e, { sets: Math.max(1, Math.min(10, e.sets + d)) }) : e; });
    this.setState({ list: list });
  }
  renderVals() {
    var self = this;
    var open = this.state.open;
    var items = this.state.list.map(function (e, i) {
      var ex = open === i;
      return {
        name: e.name, sets: String(e.sets), reps: e.reps,
        summary: e.sets + ' sets · ' + e.reps + ' reps',
        expanded: ex,
        delay: (180 + i * 60) + 'ms',
        bg: ex ? '#1B1B1B' : '#161616',
        ring: ex ? 'inset 0 0 0 1.5px #2A2A2A' : 'none',
        chev: ex ? 'rotate(180deg)' : 'rotate(0deg)',
        pick: function () { self.setState({ open: ex ? -1 : i }); },
        less: function () { self.setSets(i, -1); },
        more: function () { self.setSets(i, 1); },
        remove: function () { self.setState({ open: -1, list: self.state.list.filter(function (_, j) { return j !== i; }) }); }
      };
    });
    return { items: items };
  }
}
</script>
</body>
</html>
