<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotter — Workout mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Manrope:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;background:#0B0B0B}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
a,button,input,nav,label{flex-shrink:0;box-sizing:border-box}
.sp-fade-x{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 40px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 40px),transparent 100%)}
.sp-fade-y{-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 32px),transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 32px),transparent 100%)}
@keyframes sp-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sp-bar{from{opacity:0;transform:skewX(-26deg) scaleY(0)}to{opacity:1;transform:skewX(-26deg) scaleY(1)}}
@keyframes sp-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes sp-lock{from{opacity:0;letter-spacing:0.5em;filter:blur(4px)}to{opacity:1;letter-spacing:0.08em;filter:blur(0)}}
.sp-rise{animation:sp-rise 1000ms cubic-bezier(.16,1,.3,1) both}
.sp-bar{transform-origin:50% 100%;animation:sp-bar 900ms cubic-bezier(.16,1,.3,1) both}
.sp-press{transition:transform 260ms cubic-bezier(.16,1,.3,1),background-color 500ms ease,box-shadow 500ms ease,color 500ms ease}
.sp-press:active{transform:scale(.97)}
.sp-draw path{stroke-dasharray:24;animation:sp-draw 520ms cubic-bezier(.65,0,.35,1) both}
.sp-lock{animation:sp-lock 1400ms cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion: reduce){.sp-rise,.sp-bar,.sp-lock,.sp-draw path{animation:none}.sp-press{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0B; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 48px 16px 32px; gap: 20px;">

<div class="sp-rise" style="display: flex; align-items: center; justify-content: space-between; animation-delay: 0ms;">
<a href="Main.dc.html" class="sp-press" aria-label="End session" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #161616; text-decoration: none;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
</a>
<div style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">2 / 6</div>
<div style="font-family: Michroma, sans-serif; font-size: 13px; line-height: 18px; color: #9A9A9A; width: 44px; text-align: right;">12:40</div>
</div>

<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px;">
<div class="sp-bar" style="height: 6px; transform: skewX(-26deg); background: #E70B16; border-radius: 1px; animation-delay: 120ms;"></div>
<div class="sp-bar" style="height: 6px; transform: skewX(-26deg); background: #FFFFFF; border-radius: 1px; animation-delay: 180ms;"></div>
<div class="sp-bar" style="height: 6px; transform: skewX(-26deg); background: #222222; border-radius: 1px; animation-delay: 240ms;"></div>
<div class="sp-bar" style="height: 6px; transform: skewX(-26deg); background: #222222; border-radius: 1px; animation-delay: 300ms;"></div>
<div class="sp-bar" style="height: 6px; transform: skewX(-26deg); background: #222222; border-radius: 1px; animation-delay: 360ms;"></div>
<div class="sp-bar" style="height: 6px; transform: skewX(-26deg); background: #222222; border-radius: 1px; animation-delay: 420ms;"></div>
</div>

<a href="Exercise.dc.html" class="sp-rise" style="display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #FFFFFF; animation-delay: 160ms;">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800;">Flat Dumbbell Press</h1>
<div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9A9A;">3 sets · 8–12 reps</div>
</a>

<button type="button" class="sp-rise" onClick="{{ toggleLoop }}" aria-label="{{ loopLabel }}" style="position: relative; height: 200px; width: 100%; border: none; padding: 0; border-radius: 24px; background: #161616; overflow: hidden; cursor: pointer; animation-delay: 240ms;">
<span style="position: absolute; left: 0px; top: 0px; right: 0px; bottom: 0px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h11a4 4 0 0 1 0 8H7"></path><path d="M9 4.5L6 7l3 2.5"></path></svg>
<span style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">[SILENT LOOP · 5s]</span>
</span>
<span style="position: absolute; left: 12px; bottom: 12px; height: 28px; padding: 0 10px; display: flex; align-items: center; border-radius: 8px; background: #0B0B0B; font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: {{ loopInk }};">{{ loopText }}</span>
</button>

<div class="sp-rise" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9A9A; animation-delay: 300ms;">Feet planted. Shoulder blades back. Lower to chest level.</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<div class="sp-rise" style="display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; padding: 0 12px; font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A; animation-delay: 340ms;">
<span>SET</span><span>KG</span><span>REPS</span><span></span>
</div>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
<div class="sp-rise sp-press" style="display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center; height: 60px; padding: 0 12px; box-sizing: border-box; border-radius: 8px; background: {{ r.bg }}; box-shadow: {{ r.ring }}; animation-delay: {{ r.delay }};">
<span style="font-family: Michroma, sans-serif; font-size: 13px; line-height: 18px; color: #9A9A9A;">{{ r.n }}</span>
<span class="sp-press" style="font-family: Michroma, sans-serif; font-size: 24px; line-height: 28px; color: {{ r.ink }};">{{ r.kg }}</span>
<span class="sp-press" style="font-family: Michroma, sans-serif; font-size: 24px; line-height: 28px; color: {{ r.ink }};">{{ r.reps }}</span>
<button type="button" class="sp-press" onClick="{{ r.toggle }}" aria-label="{{ r.label }}" style="width: 44px; height: 44px; border: none; padding: 0; border-radius: 8px; background: {{ r.tickBg }}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
<sc-if value="{{ r.done }}" hint-placeholder-val="{{ false }}">
<svg class="sp-draw" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
<sc-if value="{{ r.open }}" hint-placeholder-val="{{ true }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
</button>
</div>
</sc-for>
</div>

<div style="flex-grow: 1;"></div>

<div class="sp-rise" style="display: flex; flex-direction: column; gap: 12px; animation-delay: 560ms;">
<div style="height: 18px; display: flex; justify-content: center;">
<sc-if value="{{ allDone }}" hint-placeholder-val="{{ false }}">
<div class="sp-lock" style="font-family: Michroma, sans-serif; font-size: 13px; line-height: 18px; color: #FF4450;">locked in.</div>
</sc-if>
<sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
<div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9A9A;">rest 1:30 · last time 20 kg × 10</div>
</sc-if>
</div>
<button type="button" class="sp-press" onClick="{{ logSet }}" style="height: 56px; border: none; border-radius: 16px; background: #E70B16; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; font-size: 17px; line-height: 24px; font-weight: 800; cursor: pointer;">{{ cta }}</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: [true, false, false], loop: true };
  }
  toggle(i) {
    var d = this.state.done.slice();
    d[i] = !d[i];
    this.setState({ done: d });
  }
  renderVals() {
    var self = this;
    var done = this.state.done;
    var sets = [
      { kg: '20', reps: '10' },
      { kg: '20', reps: '10' },
      { kg: '20', reps: '8' }
    ];
    var active = done.indexOf(false);
    var rows = sets.map(function (s, i) {
      var isDone = done[i];
      var isActive = i === active;
      return {
        n: String(i + 1),
        kg: s.kg,
        reps: s.reps,
        delay: (400 + i * 70) + 'ms',
        done: isDone,
        open: !isDone,
        bg: isActive ? '#222222' : '#161616',
        ring: isActive ? 'inset 0 0 0 1.5px #E70B16' : 'inset 0 0 0 1.5px rgba(231,11,22,0)',
        ink: isDone || isActive ? '#FFFFFF' : '#9A9A9A',
        tickBg: isDone ? '#E70B16' : '#222222',
        label: isDone ? 'Set ' + (i + 1) + ' done, tap to undo' : 'Mark set ' + (i + 1) + ' done',
        toggle: function () { self.toggle(i); }
      };
    });
    var allDone = active === -1;
    var loop = this.state.loop;
    return {
      rows: rows,
      toggleLoop: function () { self.setState({ loop: !self.state.loop }); },
      loopLabel: loop ? 'Pause the demo loop' : 'Play the demo loop',
      loopText: loop ? 'LOOPING' : 'PAUSED',
      loopInk: loop ? '#FF4450' : '#9A9A9A',
      allDone: allDone,
      notDone: !allDone,
      cta: allDone ? 'Next exercise' : 'Log set ' + (active + 1),
      logSet: function () {
        if (active === -1) { self.setState({ done: [false, false, false] }); return; }
        self.toggle(active);
      }
    };
  }
}
</script>
</body>
</html>
