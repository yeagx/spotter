<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotter — Edit split</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Manrope:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;background:#0B0B0B}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
a,button,input,nav,label{flex-shrink:0;box-sizing:border-box}
.sp-fade-x{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 40px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 40px),transparent 100%)}
.sp-fade-y{-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 32px),transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 32px),transparent 100%)}
@keyframes sp-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sp-bar{from{opacity:0;transform:skewX(-26deg) scaleY(0)}to{opacity:1;transform:skewX(-26deg) scaleY(1)}}
@keyframes sp-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes sp-lock{from{opacity:0;letter-spacing:0.5em;filter:blur(4px)}to{opacity:1;letter-spacing:0.08em;filter:blur(0)}}
.sp-rise{animation:sp-rise 1000ms cubic-bezier(.16,1,.3,1) both}
.sp-bar{transform-origin:50% 100%;animation:sp-bar 900ms cubic-bezier(.16,1,.3,1) both}
.sp-press{transition:transform 260ms cubic-bezier(.16,1,.3,1),background-color 500ms ease,box-shadow 500ms ease,color 500ms ease}
.sp-press:active{transform:scale(.97)}
.sp-draw path{stroke-dasharray:24;animation:sp-draw 520ms cubic-bezier(.65,0,.35,1) both}
.sp-lock{animation:sp-lock 1400ms cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion: reduce){.sp-rise,.sp-bar,.sp-lock,.sp-draw path{animation:none}.sp-press{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0B; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 48px 16px 32px; gap: 24px;">
<div class="sp-rise" style="display: flex; align-items: center; justify-content: space-between;">
<a href="Plan.dc.html" class="sp-press" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #161616; text-decoration: none;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">EDIT SPLIT</div>
<div style="min-width: 44px; display: flex; justify-content: flex-end;"></div>
</div>

<div class="sp-rise" style="display: flex; flex-direction: column; gap: 8px; animation-delay: 80ms;">
<label for="sp-split" style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">SPLIT NAME</label>
<input id="sp-split" type="text" value="Full Body" style="height: 56px; width: 100%; box-sizing: border-box; padding: 0 16px; border: none; border-radius: 8px; background: #222222; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; font-size: 17px; line-height: 24px; font-weight: 700; outline: none; font-size: 24px; line-height: 30px; font-weight: 800;">
</div>

<div class="sp-rise" style="display: flex; flex-direction: column; gap: 12px; animation-delay: 160ms;">
<div style="display: flex; justify-content: space-between;">
<div style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">TRAINING DAYS</div>
<div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9A9A;">{{ count }} per week</div>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{ week }}" as="d" hint-placeholder-count="7">
<button type="button" class="sp-press" onClick="{{ d.toggle }}" aria-pressed="{{ d.pressed }}" aria-label="{{ d.full }}" style="height: 48px; border: none; border-radius: 8px; background: {{ d.bg }}; color: {{ d.ink }}; font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; cursor: pointer; padding: 0;">{{ d.letter }}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<div class="sp-rise" style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A; animation-delay: 220ms;">DAYS</div>
<sc-for list="{{ days }}" as="d" hint-placeholder-count="3">
<a href="EditDay.dc.html" class="sp-rise sp-press" style="display: flex; align-items: center; gap: 12px; height: 68px; padding: 0 16px; border-radius: 16px; background: #161616; text-decoration: none; color: #FFFFFF; animation-delay: {{ d.delay }};">
<div style="width: 36px; font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">{{ d.day }}</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 17px; line-height: 22px; font-weight: 700;">{{ d.name }}</div>
<div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9A9A;">{{ d.meta }}</div>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>

<div style="flex-grow: 1;"></div>
<a href="Plan.dc.html" class="sp-rise sp-press" style="height: 56px; width: 100%; border: none; border-radius: 16px; background: #E70B16; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; font-size: 17px; line-height: 24px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; animation-delay: 400ms;">Save split</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: [true, false, true, false, true, false, false] };
  }
  renderVals() {
    var self = this;
    var letters = ['S', 'S', 'M', 'T', 'W', 'T', 'F'];
    var full = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    var short = ['SAT', 'SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI'];
    var names = { 0: ['Pull & press', '6 exercises · 19 sets'], 2: ['Rows & incline', '6 exercises · 18 sets'], 4: ['Shoulders & isolation', '1 exercise · 3 sets'] };
    var on = this.state.on;
    var week = letters.map(function (l, i) {
      return {
        letter: l, full: full[i], pressed: on[i] ? 'true' : 'false',
        bg: on[i] ? '#E70B16' : '#161616', ink: on[i] ? '#FFFFFF' : '#9A9A9A',
        toggle: function () { var n = on.slice(); n[i] = !n[i]; self.setState({ on: n }); }
      };
    });
    var days = [], k = 0;
    on.forEach(function (v, i) {
      if (!v) return;
      var n = names[i] || ['New day', 'No exercises yet'];
      days.push({ day: short[i], name: n[0], meta: n[1], delay: (260 + k * 70) + 'ms' });
      k++;
    });
    return { week: week, days: days, count: days.length };
  }
}
</script>
</body>
</html>
