<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotter — Exercise detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Manrope:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;background:#0B0B0B}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
a,button,input,nav,label{flex-shrink:0;box-sizing:border-box}
.sp-fade-x{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 40px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 40px),transparent 100%)}
.sp-fade-y{-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 32px),transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 32px),transparent 100%)}
@keyframes sp-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sp-bar{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes sp-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes sp-lock{from{opacity:0;letter-spacing:0.5em;filter:blur(4px)}to{opacity:1;letter-spacing:0.08em;filter:blur(0)}}
.sp-rise{animation:sp-rise 1000ms cubic-bezier(.16,1,.3,1) both}
.sp-bar{transform-origin:50% 100%;animation:sp-bar 900ms cubic-bezier(.16,1,.3,1) both}
.sp-press{transition:transform 260ms cubic-bezier(.16,1,.3,1),background-color 500ms ease,box-shadow 500ms ease,color 500ms ease}
.sp-press:active{transform:scale(.97)}
.sp-draw path{stroke-dasharray:24;animation:sp-draw 520ms cubic-bezier(.65,0,.35,1) both}
.sp-lock{animation:sp-lock 1400ms cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion: reduce){.sp-rise,.sp-bar,.sp-lock,.sp-draw path{animation:none}.sp-press{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0B; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 48px 16px 32px; gap: 24px;">

<div class="sp-rise" style="display: flex; align-items: center; justify-content: space-between;">
<a href="Main.dc.html" class="sp-press" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #161616; text-decoration: none;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">SIDE DELTS</div>
<div style="width: 44px;"></div>
</div>

<div class="sp-rise" style="display: flex; flex-direction: column; gap: 4px; animation-delay: 80ms;">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 800; letter-spacing: -0.01em;">Dumbbell Lateral Raise</h1>
<div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9A9A;">4 sets · 12–15 reps</div>
</div>

<div class="sp-rise" style="display: flex; flex-direction: column; gap: 8px; animation-delay: 160ms;">
<button type="button" onClick="{{ toggle }}" aria-label="{{ playLabel }}" style="position: relative; height: 220px; width: 100%; border: none; padding: 0; border-radius: 24px; background: #161616; overflow: hidden; cursor: pointer;">
<span style="position: absolute; left: 0px; top: 0px; right: 0px; bottom: 0px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h11a4 4 0 0 1 0 8H7"></path><path d="M9 4.5L6 7l3 2.5"></path></svg>
<span style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">[SILENT LOOP · 5s]</span>
</span>
<span style="position: absolute; left: 12px; bottom: 12px; height: 28px; padding: 0 10px; display: flex; align-items: center; border-radius: 8px; background: #0B0B0B; font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: {{ stateInk }};">{{ stateText }}</span>
<span style="position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px;">
<span class="sp-press" style="height: 28px; padding: 0 10px; display: flex; align-items: center; border-radius: 8px; background: {{ slowBg }}; font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; color: {{ slowInk }};">0.5×</span>
</span>
</button>
<div style="display: flex; justify-content: space-between;">
<span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9A9A;">Tap to pause · no sound, ever</span>
<button type="button" class="sp-press" onClick="{{ slower }}" aria-pressed="{{ slowOn }}" style="border: none; background: transparent; padding: 0; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; font-size: 13px; line-height: 18px; font-weight: 700; cursor: pointer;">Half speed</button>
</div>
</div>

<div class="sp-rise" style="display: flex; flex-direction: column; gap: 12px; animation-delay: 240ms;">
<div style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">FORM</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{ cues }}" as="c" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px;">
<div style="width: 6px; height: 14px; flex-shrink: 0; transform: skewX(-26deg); background: #9A9A9A; border-radius: 1px;"></div>
<div style="font-size: 15px; line-height: 22px; font-weight: 500;">{{ c.text }}</div>
</div>
</sc-for>
</div>
</div>

<div class="sp-rise" style="display: flex; flex-direction: column; gap: 16px; padding: 16px; border-radius: 16px; background: #161616; animation-delay: 320ms;">
<div style="display: flex; align-items: flex-end; justify-content: space-between;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">BEST</div>
<div style="display: flex; align-items: baseline; gap: 4px;">
<span style="font-family: Michroma, sans-serif; font-size: 32px; line-height: 36px;">8</span>
<span style="font-size: 13px; line-height: 18px; color: #9A9A9A;">kg × 12</span>
</div>
</div>
<div style="font-size: 13px; line-height: 18px; font-weight: 700; color: #FF4450;">new best</div>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; align-items: end; height: 64px;">
<sc-for list="{{ history }}" as="h" hint-placeholder-count="6">
<div class="sp-bar" style="height: {{ h.height }}; background: {{ h.color }}; clip-path: {{ h.clip }}; animation-delay: {{ h.delay }};"></div>
</sc-for>
</div>
<div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9A9A;">Last 6 sessions</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true, slow: false };
  }
  renderVals() {
    var self = this;
    var kg = [6, 6, 7, 7, 7.5, 8];
    var max = 8;
    var history = kg.map(function (v, i) {
      return {
        height: Math.round(20 + (v / max) * 44) + 'px',
        color: i === kg.length - 1 ? '#E70B16' : '#9A9A9A',
        clip: i === 0 ? 'polygon(0 0, 100% 0, 74% 100%, 0 100%)' : (i === kg.length - 1 ? 'polygon(26% 0, 100% 0, 100% 100%, 0 100%)' : 'polygon(26% 0, 100% 0, 74% 100%, 0 100%)'),
        delay: (420 + i * 80) + 'ms'
      };
    });
    return {
      toggle: function () { self.setState({ playing: !self.state.playing }); },
      slower: function () { self.setState({ slow: !self.state.slow }); },
      playLabel: this.state.playing ? 'Pause the loop' : 'Play the loop',
      stateText: this.state.playing ? 'LOOPING' : 'PAUSED',
      stateInk: this.state.playing ? '#FF4450' : '#9A9A9A',
      slowOn: this.state.slow ? 'true' : 'false',
      slowBg: this.state.slow ? '#E70B16' : '#0B0B0B',
      slowInk: this.state.slow ? '#FFFFFF' : '#9A9A9A',
      cues: [
        { text: 'Soft bend in the elbows.' },
        { text: 'Lead with the elbows, stop at shoulder height.' },
        { text: 'Slow on the way down.' }
      ],
      history: history
    };
  }
}
</script>
</body>
</html>
