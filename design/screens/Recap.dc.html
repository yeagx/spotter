<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotter — Monthly recap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Manrope:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;background:#0B0B0B}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
a,button,input,nav,label{flex-shrink:0;box-sizing:border-box}
.sp-fade-x{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 40px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 40px),transparent 100%)}
.sp-fade-y{-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 32px),transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 32px),transparent 100%)}
@keyframes sp-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sp-bar{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes sp-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes sp-lock{from{opacity:0;letter-spacing:0.5em;filter:blur(4px)}to{opacity:1;letter-spacing:0.08em;filter:blur(0)}}
.sp-rise{animation:sp-rise 1000ms cubic-bezier(.16,1,.3,1) both}
.sp-bar{transform-origin:50% 100%;animation:sp-bar 900ms cubic-bezier(.16,1,.3,1) both}
.sp-press{transition:transform 260ms cubic-bezier(.16,1,.3,1),background-color 500ms ease,box-shadow 500ms ease,color 500ms ease}
.sp-press:active{transform:scale(.97)}
.sp-draw path{stroke-dasharray:24;animation:sp-draw 520ms cubic-bezier(.65,0,.35,1) both}
.sp-lock{animation:sp-lock 1400ms cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion: reduce){.sp-rise,.sp-bar,.sp-lock,.sp-draw path{animation:none}.sp-press{transition:none}}
@keyframes sp-card{0%{opacity:0;transform:perspective(900px) translateY(40px) rotateX(14deg) scale(.96)}100%{opacity:1;transform:perspective(900px) translateY(0) rotateX(0) scale(1)}}
.sp-card{animation:sp-card 1300ms cubic-bezier(.16,1,.3,1) both;transform-origin:50% 100%}
@media (prefers-reduced-motion: reduce){.sp-card{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0B; color: #FFFFFF; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 48px 24px 32px; gap: 24px;">

<div class="sp-rise" style="display: flex; align-items: center; justify-content: space-between;">
<a href="Body.dc.html" class="sp-press" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #161616; text-decoration: none;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
</a>
<div style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A;">YOUR MONTH</div>
<div style="width: 44px;"></div>
</div>

<div class="sp-card" style="flex-grow: 1; border-radius: 24px; background: #161616; padding: 24px; display: flex; flex-direction: column; gap: 24px; position: relative; overflow: hidden; animation-delay: 120ms;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<div style="font-family: Michroma, sans-serif; font-size: 11px; line-height: 14px; letter-spacing: 0.12em; color: #9A9A9A; color: #FFFFFF;">SEPTEMBER</div>
<img src="/_blob/2343e23b654e0991d81019ea232da905" alt="Spotter" style="width: 22px; height: 26px; display: block;">
</div>

<div class="sp-rise" style="display: flex; flex-direction: column; gap: 4px; animation-delay: 600ms;">
<div style="font-family: Michroma, sans-serif; font-size: 72px; line-height: 76px; margin-left: -5px;">11</div>
<div style="font-size: 15px; line-height: 22px; font-weight: 700; color: #9A9A9A;">sessions of 13 planned</div>
</div>

<div style="display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 6px; align-items: end; height: 40px;">
<sc-for list="{{ ticks }}" as="t" hint-placeholder-count="13">
<div class="sp-bar" style="height: 40px; background: {{ t.color }}; clip-path: {{ t.clip }}; animation-delay: {{ t.delay }};"></div>
</sc-for>
</div>

<div style="flex-grow: 1;"></div>

<div style="display: flex; flex-direction: column;">
<sc-for list="{{ lines }}" as="l" hint-placeholder-count="3">
<div class="sp-rise" style="display: flex; align-items: baseline; justify-content: space-between; padding: 14px 0; border-top: 1px solid #2A2A2A; animation-delay: {{ l.delay }};">
<span style="font-size: 15px; line-height: 22px; font-weight: 500; color: #9A9A9A;">{{ l.label }}</span>
<span style="font-family: Michroma, sans-serif; font-size: 17px; line-height: 22px; color: {{ l.ink }};">{{ l.value }}</span>
</div>
</sc-for>
</div>

<div class="sp-rise" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9A9A; animation-delay: 1500ms;">Body fat from your check-ins on [DATE] and [DATE].</div>
<div class="sp-lock" style="font-family: Michroma, sans-serif; font-size: 15px; line-height: 20px; color: #FFFFFF; animation-delay: 1600ms;">locked in.</div>
</div>

<div class="sp-rise" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; animation-delay: 900ms;">
<button type="button" class="sp-press" style="height: 52px; border: none; border-radius: 16px; font-family: Manrope, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; background: #161616; color: #FFFFFF;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>
Save
</button>
<button type="button" class="sp-press" style="height: 52px; border: none; border-radius: 16px; font-family: Manrope, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; background: #E70B16; color: #FFFFFF;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"></path><path d="M7 9l5-5 5 5"></path><path d="M5 14v5h14v-5"></path></svg>
Share
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var done = 11, planned = 13;
    var ticks = [];
    for (var i = 0; i < planned; i++) {
      ticks.push({
        color: i < done ? '#E70B16' : '#222222',
        clip: i === 0 ? 'polygon(0 0, 100% 0, 66% 100%, 0 100%)' : (i === planned - 1 ? 'polygon(34% 0, 100% 0, 100% 100%, 0 100%)' : 'polygon(34% 0, 100% 0, 66% 100%, 0 100%)'),
        delay: (700 + i * 55) + 'ms'
      });
    }
    var lines = [
      { label: 'Best lift', value: 'Leg Press 110 kg', ink: '#FFFFFF' },
      { label: 'New bests', value: '4', ink: '#FF4450' },
      { label: 'Body fat', value: '−1.1%', ink: '#FFFFFF' }
    ].map(function (l, i) { return Object.assign({}, l, { delay: (1300 + i * 90) + 'ms' }); });
    return { ticks: ticks, lines: lines };
  }
}
</script>
</body>
</html>
