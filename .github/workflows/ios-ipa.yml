# Unsigned iPhone build, attached to the GitHub release next to the APK.
#
# There's no Mac or Apple developer account behind Spotter, so the IPA isn't signed.
# People install it with AltStore, SideStore or Sideloadly, which sign it with their own
# Apple ID (see the iPhone section on spotter-eg.vercel.app).
#
# Runs when a release tag vX.Y.Z is pushed (the same tags as the APK), or by hand from
# the Actions tab. The tag must match app.json's version.
#
# By hand with "attach" off (the default), it's a test build: the IPA (named after the
# commit) is kept as the run's artifact for testing on an iPhone, and no release changes.

name: iOS IPA

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      attach:
        description: Attach the IPA to the release (off = a test build, kept as the run's artifact)
        type: boolean
        default: false
      tag:
        description: Release to attach to, e.g. v1.7.2. Leave empty for app.json's version.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          ATTACH: ${{ inputs.attach }}
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$EVENT" != "push" ] && [ "$ATTACH" != "true" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "ipa=Spotter-v$APP_VERSION-test-${GITHUB_SHA::7}.ipa" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "push" ]; then TAG="$GITHUB_REF_NAME"; else TAG="$INPUT_TAG"; fi
          [ -z "$TAG" ] && TAG="v$APP_VERSION"
          if [ "$TAG" != "v$APP_VERSION" ]; then
            echo "::error::Tag $TAG doesn't match app.json's version ($APP_VERSION)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ipa=Spotter-$TAG.ipa" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # node_modules is cached whole (patches included: postinstall applies them), keyed on
      # the lockfile and the patches.
      - name: Restore node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'patches/**') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild -p ios --clean --no-install

      # Pods follow the native dependencies (lockfile, app.json plugins, patches).
      - name: Restore Pods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'patches/**') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install Pods
        working-directory: ios
        run: pod install

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace $WORKSPACE, scheme $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Spotter.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      # An unsigned build carries no entitlements, and AltStore, SideStore and Sideloadly
      # read them from the app to know what to ask Apple for (App Groups for the widgets,
      # HealthKit). An ad-hoc signature with each target's entitlements file puts them
      # there; the sideloader then signs over it with the user's Apple ID. Inside out:
      # frameworks, then extensions, then the app.
      - name: Write the entitlements into the app
        run: |
          APP=$(ls -d "$RUNNER_TEMP/Spotter.xcarchive/Products/Applications/"*.app | head -1)
          NAME=$(basename "$APP" .app)
          sign() { # bundle, entitlements file (may not exist)
            if [ -f "$2" ]; then
              echo "Signing $(basename "$1") with $2"; cat "$2"
              codesign --force --sign - --timestamp=none --generate-entitlement-der --entitlements "$2" "$1"
            else
              echo "Signing $(basename "$1") (no entitlements)"
              codesign --force --sign - --timestamp=none "$1"
            fi
          }
          find "$APP" -depth \( -name "*.framework" -o -name "*.dylib" \) -print0 | while IFS= read -r -d '' f; do
            codesign --force --sign - --timestamp=none "$f"
          done
          for EXT in "$APP"/PlugIns/*.appex; do
            [ -e "$EXT" ] || continue
            E=$(basename "$EXT" .appex)
            sign "$EXT" "ios/$E/$E.entitlements"
          done
          sign "$APP" "ios/$NAME/$NAME.entitlements"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | head -c 2000; echo

      - name: Package the IPA
        env:
          IPA: ${{ steps.version.outputs.ipa }}
        run: |
          APP=$(ls -d "$RUNNER_TEMP/Spotter.xcarchive/Products/Applications/"*.app | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/$IPA" Payload)
          ls -lh "$GITHUB_WORKSPACE/$IPA"

      - name: Keep the IPA as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.ipa }}
          path: ${{ steps.version.outputs.ipa }}
          retention-days: 30

      # The tag is usually created with the release, but a pushed tag can come first: wait
      # for the release (up to 45 minutes) rather than miss it.
      - name: Attach the IPA to the release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          IPA: ${{ steps.version.outputs.ipa }}
        run: |
          for i in $(seq 1 45); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            echo "No release $TAG yet, waiting a minute ($i/45)"
            sleep 60
          done
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "::warning::No release $TAG on GitHub. The IPA is kept as this run's artifact."
            exit 0
          fi
          gh release upload "$TAG" "$IPA" --clobber
          echo "Attached $IPA to $TAG"
